    ru:
      - "Делаю AI-продукты и довожу их до защиты: сам пишу техзадание и собираю прототип вместе с ИИ-агентами. Так за 24 часа в одиночку появился Overrule на хакатоне Business Cup 2.0, а с командой Enactus Myrzakhmetov — Tamyr, который вышел в финал National Founder Cup 2026. На областном конкурсе AQMOLA POWER 2024 получил III место в направлении IT."
      - "Учусь на третьем курсе Кокшетауского университета имени Абая Мырзахметова по программе «Безопасность жизнедеятельности и защита окружающей среды», до этого окончил колледж «Арна» по специальности «Защита в чрезвычайных ситуациях». В 2026 году семестр учился по обмену в Universitas Negeri Surabaya в Индонезии."
      - "Участвую в научных конференциях по пожарной безопасности и охране окружающей среды. В свободное время — баскетбол и бег."
    en:
      - "I build AI products and take them all the way to a defence: I write the spec myself and assemble the prototype together with AI coding agents. That is how I built Overrule solo in 24 hours at the Business Cup 2.0 hackathon, and how our Enactus Myrzakhmetov team made Tamyr, which reached the National Founder Cup 2026 final. At the regional AQMOLA POWER 2024 contest I took third place in the IT track."
      - "I am a third-year student at Abai Myrzakhmetov Kokshetau University in Life Safety and Environmental Protection; before that I graduated from Arna Higher College in emergency protection. In 2026 I spent a semester on exchange at Universitas Negeri Surabaya in Indonesia."
      - "I take part in research conferences on fire safety and environmental protection. Outside of that — basketball and running."
